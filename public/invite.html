<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRS Safety — Set your password</title>
<style>
  :root{--grs:#EC4B32;--grs-dark:#C53A23;--ink:#17150f;--muted:#6f685d;
    --line:#e7e2d9;--paper:#f4f1ea;--card:#fff;--slab:#23211b;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--slab);color:var(--ink);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px;}
  .box{background:var(--card);border-radius:16px;width:100%;max-width:380px;
    padding:36px 34px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
  .logo{height:38px;margin-bottom:22px;}
  h1{font-size:19px;margin:0 0 4px;font-weight:800;letter-spacing:-.02em;}
  .sub{font-size:13px;color:var(--muted);margin:0 0 26px;}
  label{display:block;font-size:12px;font-weight:700;margin:0 0 6px;letter-spacing:.02em;}
  input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:9px;
    font-size:15px;font-family:inherit;margin-bottom:16px;}
  input:read-only{background:var(--paper);color:var(--muted);}
  input:focus{outline:2px solid var(--grs);outline-offset:1px;border-color:var(--grs);}
  button{width:100%;background:var(--grs);color:#fff;border:none;padding:13px;border-radius:9px;
    font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;}
  button:hover{background:var(--grs-dark);}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .err{background:#fbeae7;color:#c0392b;font-size:13px;padding:10px 12px;border-radius:8px;
    margin-bottom:16px;display:none;}
  .err.show{display:block;}
  .hint{font-size:12px;color:var(--muted);margin:-8px 0 16px;}
  .foot{text-align:center;font-size:11px;color:var(--muted);margin-top:22px;}
  .foot a{color:var(--grs);}
</style>
</head>
<body>
  <div class="box">
    <img class="logo" id="logo" alt="GRS">
    <h1>Set your password</h1>
    <p class="sub" id="sub">Checking your invite…</p>
    <div class="err" id="err"></div>
    <div id="form" style="display:none">
      <label for="email">Email</label>
      <input type="email" id="email" readonly>
      <label for="password">Choose a password</label>
      <input type="password" id="password" autocomplete="new-password" autofocus>
      <div class="hint">At least 8 characters. Use something you do not use anywhere else.</div>
      <label for="password2">Type it again</label>
      <input type="password" id="password2" autocomplete="new-password">
      <button id="btn">Set password and sign in</button>
    </div>
    <div class="foot" id="foot">Oversight by Safety Simplified Ltd</div>
  </div>
<script src="/logo.js"></script>
<script>
  document.getElementById('logo').src = window.__GRS_LOGO__ || '';
  const err = document.getElementById('err'), sub = document.getElementById('sub'),
        form = document.getElementById('form'), btn = document.getElementById('btn');
  const token = new URLSearchParams(location.search).get('t') || '';
  function show(m){ err.textContent = m; err.classList.add('show'); }

  (async function(){
    if(!token){ sub.textContent = 'This link is missing its code.'; show('Use the full link you were sent.'); return; }
    try{
      const r = await fetch('/api/invite/' + encodeURIComponent(token));
      const d = await r.json();
      if(!r.ok){ sub.textContent = 'This invite cannot be used.'; show(d.error || 'Invalid invite.');
        document.getElementById('foot').innerHTML = 'Already set up? <a href="/login.html">Sign in</a>'; return; }
      sub.textContent = 'Hi ' + d.name + '. This is your GRS Safety portal login.';
      document.getElementById('email').value = d.email;
      form.style.display = 'block';
    }catch(e){ sub.textContent = 'Could not reach the server.'; show('Check your connection and reload.'); }
  })();

  async function go(){
    err.classList.remove('show');
    const p1 = document.getElementById('password').value, p2 = document.getElementById('password2').value;
    if(p1.length < 8){ show('Password needs to be at least 8 characters.'); return; }
    if(p1 !== p2){ show('The two passwords do not match.'); return; }
    btn.disabled = true; btn.textContent = 'Saving…';
    try{
      const r = await fetch('/api/invite/' + encodeURIComponent(token), {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: p1 }) });
      const d = await r.json();
      if(!r.ok){ show(d.error || 'Could not set password.'); return; }
      location.href = '/';
    }catch(e){ show('Network error. Try again.'); }
    finally{ btn.disabled = false; btn.textContent = 'Set password and sign in'; }
  }
  btn.addEventListener('click', go);
  document.getElementById('password2').addEventListener('keydown', e => { if(e.key==='Enter') go(); });
</script>
</body>
</html>
